# Builds, tests and packages Phase Distorter for macOS, Windows and Linux. The translated game program is committed in generated/, so no ROM is
# needed to build and no secrets are used: pull requests build too. Packages contain no
# ROM and no imported assets.
#
# - Pull requests and manual runs: build and test on macOS, Windows and Linux; the
#   three ZIPs are kept as workflow artifacts.
# - Each push to main (other than one changing only .md files): the same, plus a draft
#   "Latest build" release holding the ZIPs, replaced by the next push's. Drafts are
#   only visible to the repository's collaborators.
# - A pushed tag like v0.1-mac: the same, then a published release with the ZIPs and
#   the notes in .github/release/notes.md.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Path filters only apply to branch pushes: a tag always builds.
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Apple Silicon. macOS 15 rather than the newest: the app (and the Homebrew SDL
    # bundled in it) can't run on a macOS older than the one it's built on.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja sdl2-compat sdl3 dylibbundler

      - name: Build and package
        run: ./build-macos.sh

      - name: Build the tests
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -E '^(video_tests|debug_panel_tests)$'

      - name: Test OpenGL
        # These open a window. Hosted macOS runners are VMs without a GPU, where an
        # OpenGL context may be unavailable, so they report without failing the build.
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -R '^(video_tests|debug_panel_tests)$'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  windows:
    # Upstream's Windows toolchain: MSYS2 UCRT64 GCC, with the official SDL2 MinGW
    # release that upstream ships. The package comes from upstream's packager.
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Get SDL2
        # The DLL must be the one cpp/external/sdl2/PROVENANCE.md records.
        run: |
          curl -fsSL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.tar.gz
          tar -xzf sdl2.tar.gz
          echo "53e8fa7e9ed43c30bd650c39396f0d9d2067d2fff0b926c9433b75202592e4aa  SDL2-2.32.10/x86_64-w64-mingw32/bin/SDL2.dll" | sha256sum -c

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL2_DIR="$(cygpath -m "$PWD/SDL2-2.32.10/cmake")"
          cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -E '^(video_tests|debug_panel_tests)$'

      - name: Test OpenGL
        # As on macOS: hosted Windows runners have no GPU, and Windows' fallback
        # OpenGL may not provide these tests' context. Reported, not required.
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -R '^(video_tests|debug_panel_tests)$'

      - name: Package
        run: |
          cmake --install build --prefix install
          python3 cpp/tools/package_release.py --platform windows --binaries-dir install --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    # Upstream's Linux runtime recipe (lib/PROVENANCE.md): original SDL 2.32.10
    # from its official archive, bundled with the C++ runtime in lib/. Built on
    # Ubuntu 24.04, so it needs an older glibc than the runtime committed in lib/.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # SDL loads its video and audio backends at run time, but needs their
        # headers to include them.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3 patchelf libgl1-mesa-dri xvfb \
            libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libudev-dev libdbus-1-dev libsamplerate0-dev

      - name: Build SDL2
        run: |
          curl -fsSL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          python3 cpp/tools/stage_linux_runtime.py build-sdl --archive sdl2.tar.gz --prefix "$PWD/sdl/install"

      - name: Build
        run: ./build-linux.sh -G Ninja -DSDL2_DIR="$PWD/sdl/install/lib/cmake/SDL2"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cmake --install build --prefix install
          glibc=$(python3 cpp/tools/stage_linux_runtime.py stage --sdl-prefix sdl/install \
            --sdl-source sdl/sdl-work/SDL2-2.32.10 --application "install/Phase Distorter" --output runtime)
          echo "Runtime requires glibc $glibc"
          python3 cpp/tools/package_release.py --platform linux --binaries-dir install \
            --linux-runtime-dir runtime --glibc "$glibc" --output-dir dist

      - name: Check the package runs from its own lib/
        # The packaged application must find the bundled SDL2 and C++ runtime.
        run: |
          cd dist && unzip -q *.zip && cd Phase-Distorter-*-linux-x86_64
          ldd "$PWD/Phase Distorter" | tee ldd.txt
          grep -q "libSDL2-2.0.so.0 => $PWD/lib/" ldd.txt
          grep -q "libstdc++.so.6 => $PWD/lib/" ldd.txt
          grep -q "libgcc_s.so.1 => $PWD/lib/" ldd.txt
          if grep -q "not found" ldd.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [macos, windows, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*'
          path: package
          merge-multiple: true

      - name: Release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" package/*.zip --verify-tag \
              --title "Phase Distorter $GITHUB_REF_NAME" --notes-file .github/release/notes.md
          else
            # One draft for the branch's newest build: the previous push's is replaced.
            gh release delete latest-build --yes 2>/dev/null || true
            gh release create latest-build package/*.zip --draft --target "$GITHUB_SHA" \
              --title "Latest build ($GITHUB_REF_NAME, ${GITHUB_SHA:0:7})" \
              --notes "Build of $GITHUB_REF_NAME at $GITHUB_SHA (not published). Replaced by the next push's."
          fi
